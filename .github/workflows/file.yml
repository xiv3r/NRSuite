name: Firmware

on:
  workflow_dispatch:
  release:
    types: [published]  
    
jobs:
  download-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Install Arduino-cli
      run: |
        mkdir -p downloads
        cd downloads
        wget https://github.com/7wp81x/NRSuite/releases/download/v1.2.0/nrsuite-esp32-generic.bin
        wget https://github.com/7wp81x/NRSuite/releases/download/v1.2.0/nrsuite-esp32c3.bin
        wget https://github.com/7wp81x/NRSuite/releases/download/v1.2.0/nrsuite-esp32s2.bin
        wget https://github.com/7wp81x/NRSuite/releases/download/v1.2.0/nrsuite-esp32s3.bin

    - name: Determine release tag
      id: get_tag
      run: |
        if [ "${{ github.event_name }}" == "release" ]; then
          TAG_NAME="${{ github.event.release.tag_name }}"
        else
          TAG_NAME="v1.2.0"
        fi
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

    - name: Upload files to existing release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.get_tag.outputs.tag_name }}
        files: |
          downloads/*.*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
